[workspace]
resolver = "2"
members = [
    "crates/protocol-core",
    "crates/risk-engine",
    "evm/ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Kryon Protocol"]
license = "MIT OR Apache-2.0"
rust-version = "1.84.0"

[workspace.dependencies]
soroban-sdk = "27.0.6"
protocol-core = { path = "crates/protocol-core" }
risk-engine = { path = "crates/risk-engine" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
