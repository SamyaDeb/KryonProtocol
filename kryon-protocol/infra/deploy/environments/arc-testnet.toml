# Kryon on Arc testnet: deployment configuration.
#
# Read by kryon-protocol/evm/script/*.s.sol (DeployConfig.sol) and checked by
# 99_VerifyDeployment. Every value here is
# public; keys and RPC credentials come from the environment, never this file.
# Facts marked [docs/arc-facts.md] were verified on 2026-09-16.

market_keys = ["btc", "eth", "sol", "xrp", "bnb", "trx"]

[network]
name = "arc-testnet"
chain_id = 5042002
# Public RPC is the last-resort fallback; services use provider URLs from env.
public_rpc = "https://rpc.testnet.arc.io"
explorer = "https://explorer.testnet.arc.io"
explorer_api = "https://explorer.testnet.arc.io/api/"
# 20 gwei floor (docs state it for testnet; mainnet observed >= 20). TxSender floor.
min_base_fee_gwei = 20

[assets]
# USDC ERC-20 interface, 6 decimals [docs/arc-facts.md §4.1]
usdc = "0x3600000000000000000000000000000000000000"
eurc = "0x89B50855Aa3bE2F677cD6303Cec089B5F319D72a"
permit2 = "0x000000000022D473030F116dDEE9F6B43aC78BA3"
multicall3 = "0xcA11bde05977b3631167028862bE2a173976CA11"
cctp_token_messenger = "0x8FE6B999Dc680CcFDD5Bf7EB0974218be2542DAA"
cctp_domain = 26
# No Chainlink feeds are published for Arc testnet [docs/arc-facts.md §4.3].
chainlink_usdc_usd = ""

[governance]
# 48h minimum is enforced by KryonTimelock itself.
timelock_min_delay_secs = 172800
# Testnet stand-in for the governance Safe (N-of-M on mainnet): the wallet
# generated by `npm run testnet:keys`, proposer and executor in one.
proposers = ["0xC84cada900EA40b4016d98C1cF1bc3Ec49032d00"]
executors = ["0xC84cada900EA40b4016d98C1cF1bc3Ec49032d00"]
# Testnet stand-in for the guardian Safe. Holds PAUSER_ROLE only.
guardian = "0xf9f44DE5F19CDF569C01bbc0420639f204d3b7FE"
# Testnet stand-in for the treasury Safe. Receives treasury fee claims.
treasury = "0x661b80364695931dfadD3f0d19a6bCe37c2fB6a1"

[roles]
# Testnet service keys, one per service (see runbooks/key-rotation.md).
operators = ["0x8B0920923e8D80146E075d2C58Cc91BaB0640C30"]
publishers = ["0xA1EFB589CaF5AbD41b6eda368B4DCaF6f64fd5dc", "0xCf5954E66c745D5558365B3e91b8381BaB2A7c67"]
funding_keepers = ["0xd7E29317Eb9834ccFC82E31B7Ff6c37FB2150572"]
fee_tier_bots = ["0xE084dD4412cfA8F0169a37346790db45590c2Cd8"]

[vault]
# Guarded launch: $250k total, $10k per account (6-decimal USDC units).
deposit_cap = 250000000000
account_deposit_cap = 10000000000
# Testnet convenience: caps are applied before handover.
open_deposits_at_deploy = true

[liquidation]
# Decided 2026-09-17: below every active market's liquidation fee, so insurance
# and treasury always receive part of the penalty (guarded by EnvironmentConfig.t.sol).
max_reward_bps = 15
partial_liquidation_bps = 5000

[fees]
# Millionths of notional: 350 = 3.5 bps taker, 50 = 0.5 bps maker.
taker_rate = 350
maker_rate = 50
min_net_rate = 100
rebates_enabled = false
referrals_enabled = false
split_treasury_bps = 7000
split_insurance_bps = 2000
split_referral_bps = 1000
liquidation_insurance_bps = 5000

[risk]
# Aggregate OI-policy ceiling (bps of the insurance fund). 0 = no ceiling.
max_total_oi_policy_bps = 0

[oracle]
# Push on >= 5 bps move or a 5s heartbeat (keeper); on-chain max age 15s.
push_deviation_bps = 5
heartbeat_secs = 5
max_age_secs = 15
max_confidence_bps = 100
min_publishers = 1
max_spread_bps = 50
max_jump_bps = 2000

[keepers]
funding_interval_secs = 3600
liquidation_interval_secs = 2
tx_retry_limit = 5

[markets.btc]
market_id = 2
symbol = "BTC-PERP"
oracle_id = "BTC"
active = true
initial_margin_bps = 200
maintenance_margin_bps = 100
liquidation_fee_bps = 25
max_leverage_bps = 500000
max_execution_deviation_bps = 75
max_oracle_age_secs = 15
max_oracle_confidence_bps = 100
# Base units, 18 decimals applied by the loader.
max_open_interest = "25"
min_fill_notional_usd = 40
funding_premium_coeff = "1"
# 0.05%/h clamp, as a 1e18 fraction.
funding_max_rate_per_hour = "500000000000000"
oi_policy_bps = 0
# No independent reference feed confirmed for this market on this network.
reference_aggregator = ""
reference_max_divergence_bps = 150
reference_max_age_secs = 90000

