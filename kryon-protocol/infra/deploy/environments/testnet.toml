# ── Markets ───────────────────────────────────────────────────────────────────
# One [[markets]] entry per registered perpetual. This replaced the singular
# [initial_market] table on 2026-08-22: the contracts were always multi-market
# (every piece of state is keyed on u32 market_id), only the manifest was not.
#
# client/config/index.ts MARKETS is the single source of truth — these entries
# mirror it for deploy tooling. settlement_asset_contract comes from
# [assets].circle_usdc above.

