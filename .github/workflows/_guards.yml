name: guards

# Repository-wide guards. Cheap greps that run on every change, docs-only
# included, so nothing that must never land can slip past the path filter.
#
# To add a guard: add a job here (contents: read, a timeout, no secrets). It
# reports under `guards / <job name>` and is gated by `ci-gate` through the
# `guards` job in ci.yml, with no change to branch protection.
on:
  workflow_call:

permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Separation guard: no tracked file may reference the previous deployment's
  # hosts, hosting-provider project/team ids, Cloudflare account or VM address. Each literal is written with a
  # character class so this file does not match its own pattern.
  # ---------------------------------------------------------------------------
  separation-guard:
    name: separation-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: No references to the previous deployment
        env:
          PATTERN: 'kryonprotocol[.]live|client-eight-mu-7[1]|kryon-client[.]kryon[.]workers[.]dev|kryonprotocol[.]vercel[.]app|prj_[A-Za-z0-9]{20,}|team_[A-Za-z0-9]{20,}|samyadebs-project[s]|b8a23edf0ffbfe1137d1d672b001723[8]|92[.]4[.]91[.]3[0]'
        run: |
          if git grep -nE "$PATTERN"; then
            echo "::error::Tracked files reference the previous deployment (see matches above)."
            exit 1
          fi
          echo "clean"

  # ---------------------------------------------------------------------------
  # Secret scan of the working tree, on top of GitHub's own push protection.
  # Gitleaks reads the tree the PR would merge, so a secret that push protection
  # does not recognise (a service key, an RPC URL with a token, an operator
  # private key) still fails the merge.
  # ---------------------------------------------------------------------------
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install gitleaks
        uses: ./.github/actions/verified-tool
        with:
          url: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          binary: gitleaks

      # --redact so a detected secret is never echoed into a public log.
      - name: Scan the working tree
        run: gitleaks dir . --redact --no-banner --config .gitleaks.toml

  # ---------------------------------------------------------------------------
  # Workflow linting. actionlint catches shell and expression errors; zizmor
  # catches the security patterns that matter here — template injection from
  # untrusted input, excessive permissions, unpinned actions.
  # ---------------------------------------------------------------------------
  workflow-lint:
    name: workflow lint (actionlint · zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install actionlint
        uses: ./.github/actions/verified-tool
        with:
          url: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          sha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          binary: actionlint

      - name: actionlint
        run: actionlint -color

      # --min-severity medium: the low-severity findings are style hints, and a
      # gate that cries wolf gets ignored. Injection and permission findings are
      # medium or high and do fail.
      - name: zizmor
        run: pipx run zizmor==1.30.1 --offline --min-severity medium --no-progress .github
