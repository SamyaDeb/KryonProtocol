name: scorecard

# OpenSSF Scorecard: an outside read of this repository's supply-chain posture
# (branch protection, pinned dependencies, token permissions, signed releases,
# dangerous workflow patterns). Weekly, plus whenever branch protection changes,
# so a settings change that weakens the repo shows up without anyone asking.
on:
  branch_protection_rule:
  schedule:
    - cron: "43 4 * * 2" # Tuesdays 04:43 UTC
  push:
    branches: [main]

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Upload the result to Code Scanning.
      security-events: write
      # publish_results: the signed attestation that backs the README badge.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes to the public OpenSSF dashboard, which is what lets the
          # README badge render. This repository is public already.
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3.38.1
        with:
          sarif_file: results.sarif
          category: scorecard
