name: deploy-production

# Deploys the trading client to the services VM after a push to main, but ONLY
# after the readiness gate (lint, typecheck, build) passes.
#
# WHY NOT VERCEL ANY MORE
# -----------------------
# Postgres lives on the services VM and listens on loopback only. A serverless
# web tier cannot reach it — no route to the box, and no static egress IP to
# allowlist even if 5432 were opened. Vercel and Cloudflare Workers both served
# `503 readiness_unavailable` on every database route for exactly that reason.
# The app now runs on the VM itself behind a Cloudflare Tunnel, so the database
# is a loopback call again. See kryon-protocol/infra/a1flex/WEB-TIER.md.
#
# Required environment secrets: VM_SSH_KEY (private key), VM_HOST, VM_USER.
# The deploy job is skipped cleanly when they are absent, so this workflow is
# safe to merge before the VM cutover is finished.
on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "docs/**"
      - ".github/workflows/deploy-production.yml"
      - ".github/actions/setup-client/**"

# Never run two production deploys at once and never cancel one in flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Default to read-only; the deploy job needs nothing more than reading the repo.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Gate: identical checks to CI so we never promote a broken build.
  # ---------------------------------------------------------------------------
  gate:
    name: readiness gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-client

      - name: Lint
        run: npm run lint

      - name: Production readiness gate
        run: npm run production:gate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Deploy: build and restart on the services VM, over SSH.
  # ---------------------------------------------------------------------------
  deploy:
    name: vm production deploy
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ vars.NEXT_PUBLIC_APP_URL }}
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
    steps:
      - name: Check deploy secrets
        id: check
        run: |
          if [ -z "${{ secrets.VM_SSH_KEY }}" ] || [ -z "$VM_HOST" ] || [ -z "$VM_USER" ]; then
            echo "::notice::VM_SSH_KEY / VM_HOST / VM_USER not set — skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        if: steps.check.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy.key
          chmod 600 ~/.ssh/deploy.key
          # Pin the host key instead of accepting blindly: this key can restart
          # the process that serves real positions, so a MITM here is not a
          # theoretical concern.
          if [ -n "${{ secrets.VM_HOST_KEY }}" ]; then
            printf '%s\n' "${{ secrets.VM_HOST_KEY }}" > ~/.ssh/known_hosts
          else
            echo "::warning::VM_HOST_KEY not set — falling back to TOFU for this connection."
            ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      # The VM builds its own bundle. NEXT_PUBLIC_* values are inlined into the
      # client bundle by static textual substitution at build time, so a bundle
      # built in CI would carry the runner's env — which is how a compiled chunk
      # once shipped testnet contract addresses to a mainnet deployment.
      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/deploy.key -o BatchMode=yes "$VM_USER@$VM_HOST" \
            'set -euo pipefail
             cd ~/kryon
             # REFUSE to reset over local modifications. The VM has historically
             # carried fixes that never reached git — the PUBLISH_TIME_BACKDATE_SECS
             # fix and the lib/sql.ts Postgres shim among them. A blind
             # `reset --hard` would silently revert the running keepers to code
             # whose every oracle publish fails with Error(Contract, #6), and
             # which cannot talk to the local database at all.
             if [ -n "$(git status --porcelain)" ]; then
               echo "::error::Working tree on the VM is dirty. Commit and push those"
               echo "changes before deploying, or they will be destroyed:"
               git status --short
               exit 1
             fi
             git fetch --all --prune
             git reset --hard origin/main
             bash kryon-protocol/infra/a1flex/setup-web-tier.sh'

      - name: Verify the deployed site
        if: steps.check.outputs.ready == 'true'
        run: |
          url="${{ vars.NEXT_PUBLIC_APP_URL }}"
          [ -n "$url" ] || { echo "::error::NEXT_PUBLIC_APP_URL var not set"; exit 1; }
          # Both networks: the toggle serves both venues from this one
          # deployment, and an unconfigured second database only fails on the
          # routes that ask for it — which a mainnet-only check would miss.
          for net in mainnet testnet; do
            body=$(curl -fsS -m 20 "$url/api/ready?network=$net") || {
              echo "::error::$net readiness request failed"; exit 1; }
            echo "$net → $body"
            case "$body" in
              *'"ok":true'*) ;;
              *) echo "::error::$net not ready after deploy"; exit 1 ;;
            esac
          done
          { echo "### ✅ Production deploy (VM)"; echo "$url"; } >> "$GITHUB_STEP_SUMMARY"
