name: ci

# Continuous integration for the Kryon Perps DEX monorepo.
# Modular jobs (client / contracts / prisma / security) run in parallel so
# unrelated changes still get full coverage without serializing the pipeline.
on:
  pull_request:
  push:
    branches: [main]

# Least-privilege by default. Individual jobs add scopes only if they need them.
# This overrides any permissive repo/org default (which can otherwise be write-all).
permissions:
  contents: read

# Cancel superseded runs on the same ref/PR to save runner minutes, but never
# cancel a push to main mid-flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Separation guard: no tracked file may reference the previous deployment's
  # hosts, hosting-provider project/team ids, Cloudflare account or VM address. Each literal is written with a
  # character class so this file does not match its own pattern.
  # ---------------------------------------------------------------------------
  separation-guard:
    name: separation-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: No references to the previous deployment
        env:
          PATTERN: 'kryonprotocol[.]live|client-eight-mu-7[1]|kryon-client[.]kryon[.]workers[.]dev|kryonprotocol[.]vercel[.]app|prj_[A-Za-z0-9]{20,}|team_[A-Za-z0-9]{20,}|samyadebs-project[s]|b8a23edf0ffbfe1137d1d672b001723[8]|92[.]4[.]91[.]3[0]'
        run: |
          if git grep -nE "$PATTERN"; then
            echo "::error::Tracked files reference the previous deployment (see matches above)."
            exit 1
          fi
          echo "clean"

  # ---------------------------------------------------------------------------
  # Frontend: lint, typecheck, unit tests, and a real Next.js build.
  # ---------------------------------------------------------------------------
  client:
    name: client (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    env:
      KRYON_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/kryon_test
    # The TxJobStore, indexer and matcher suites skip themselves without a
    # database. That is right locally and wrong here: skipping in CI means the
    # settlement and matching paths that own money are never exercised.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: kryon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Local composite actions require the repo on disk first.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-client

      - name: Migrate the test database
        run: psql "$KRYON_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f ../kryon-protocol/prisma/migrations/*/migration.sql

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # The client's node:test suites had no runner and no script, so they had
      # never executed despite CI being green. Run them.
      - name: Unit and database tests
        run: npm test

      - name: Build
        run: npm run build

      # Upload the build (minus the cache) for debugging. always() + ignore keeps
      # this from masking or failing on an earlier build error.
      - name: Upload build artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: client-next-build
          path: |
            client/.next/
            !client/.next/cache/**
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Rust reference model (protocol-core, risk-engine) and the kryon-ref ffi
  # binary the Solidity differential tests call.
  # ---------------------------------------------------------------------------
  reference-model:
    name: reference model (fmt · clippy · test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: kryon-protocol
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Pinned; MUST match kryon-protocol/rust-toolchain.toml.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt,clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kryon-protocol

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (warnings = errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # ---------------------------------------------------------------------------
  # Matcher end-to-end: the real matching service against a local arc-anvil,
  # a real deployment and a real Postgres. This is the only job where an order
  # is signed, matched, batched and settled the whole way through, so a change
  # that breaks settlement fails here rather than on testnet.
  # ---------------------------------------------------------------------------
  matcher-e2e:
    name: matcher e2e (arc-anvil · deploy · settle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARC_FOUNDRY_VERSION: v0.8.0-1
      KRYON_E2E_DATABASE_URL: postgresql://ci:ci@localhost:5432/kryon_e2e
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: kryon_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install arc-foundry (checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          V="$ARC_FOUNDRY_VERSION"
          T="arc-foundry-$V-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO "https://github.com/circlefin/arc-foundry/releases/download/$V/$T"
          curl -fsSLO "https://github.com/circlefin/arc-foundry/releases/download/$V/$T.sha256"
          sha256sum -c "$T.sha256"
          tar -xzf "$T"
          mkdir -p "$HOME/.local/bin"
          mv forge "$HOME/.local/bin/arc-forge"
          mv cast "$HOME/.local/bin/arc-cast"
          mv anvil "$HOME/.local/bin/arc-anvil"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup client
        uses: ./.github/actions/setup-client

      - name: Migrate the end-to-end database
        run: psql "$KRYON_E2E_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f kryon-protocol/prisma/migrations/*/migration.sql

      - name: Run the matcher end to end
        working-directory: client
        run: npm run test:e2e:matcher

  # ---------------------------------------------------------------------------
  # Keeper drills: each keeper's real code against a local arc-anvil and a real
  # deployment, driven through the failure modes it exists to handle (quorum
  # loss, re-anchor, divergence, de-peg, ...). Local only; the drills refuse a
  # non-loopback RPC.
  # ---------------------------------------------------------------------------
  keeper-drills:
    name: keeper drills (arc-anvil)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARC_FOUNDRY_VERSION: v0.8.0-1
      KRYON_E2E_DATABASE_URL: postgresql://ci:ci@localhost:5432/kryon_drills
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: kryon_drills
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install arc-foundry (checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          V="$ARC_FOUNDRY_VERSION"
          T="arc-foundry-$V-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO "https://github.com/circlefin/arc-foundry/releases/download/$V/$T"
          curl -fsSLO "https://github.com/circlefin/arc-foundry/releases/download/$V/$T.sha256"
          sha256sum -c "$T.sha256"
          tar -xzf "$T"
          mkdir -p "$HOME/.local/bin"
          mv forge "$HOME/.local/bin/arc-forge"
          mv cast "$HOME/.local/bin/arc-cast"
          mv anvil "$HOME/.local/bin/arc-anvil"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup client
        uses: ./.github/actions/setup-client

      - name: Migrate the drill database
        run: psql "$KRYON_E2E_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f kryon-protocol/prisma/migrations/*/migration.sql

      - name: Oracle publisher drill
        working-directory: client
        run: npm run drill:oracle

      - name: Funding keeper drill
        working-directory: client
        run: npm run drill:funding

      - name: Liquidation cascade drill
        working-directory: client
        run: npm run drill:liquidation

  # ---------------------------------------------------------------------------
  # Solidity suite on arc-foundry (pinned). Build sizes, unit/invariant tests,
  # differential fuzz vs the Rust reference, storage-layout diff, Slither.
  # The full job set (coverage, gas diff, fork tests) lands with Step 6.
  # ---------------------------------------------------------------------------
  evm:
    name: evm (arc-foundry · test · differential · layout · slither)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ARC_FOUNDRY_VERSION: v0.8.0-1
    defaults:
      run:
        working-directory: kryon-protocol/evm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install arc-foundry (checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          V="$ARC_FOUNDRY_VERSION"
          T="arc-foundry-$V-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO "https://github.com/circlefin/arc-foundry/releases/download/$V/$T"
          curl -fsSLO "https://github.com/circlefin/arc-foundry/releases/download/$V/$T.sha256"
          sha256sum -c "$T.sha256"
          tar -xzf "$T"
          mkdir -p "$HOME/.local/bin"
          mv forge "$HOME/.local/bin/arc-forge"
          mv cast "$HOME/.local/bin/arc-cast"
          mv anvil "$HOME/.local/bin/arc-anvil"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kryon-protocol

      - name: Build (sizes must stay under 24KB)
        run: arc-forge build --sizes

      - name: Unit, upgrade and invariant tests
        run: arc-forge test

      - name: Differential fuzz vs Rust reference (G1)
        run: |
          (cd .. && cargo build -p kryon-ref --release --locked)
          FOUNDRY_PROFILE=differential arc-forge test

      - name: Storage-layout diff
        run: ./script/storage-layout.sh --check

      # crytic-compile shells out to `forge config`; point that name at
      # arc-forge for this step only so Slither analyses the Arc build.
      - name: Slither (fail on High/Medium)
        run: |
          mkdir -p "$RUNNER_TEMP/forge-shim"
          ln -sf "$(command -v arc-forge)" "$RUNNER_TEMP/forge-shim/forge"
          export PATH="$RUNNER_TEMP/forge-shim:$PATH"
          arc-forge build --build-info --skip "test/**" --skip "script/**" --force
          pipx run --spec slither-analyzer==0.11.6 slither . --foundry-out-directory out \
            --ignore-compile --filter-paths "lib/|test/|script/" \
            --exclude-informational --exclude-low --fail-medium

  # ---------------------------------------------------------------------------
  # Database schema: validate + generate the Prisma client.
  # ---------------------------------------------------------------------------
  prisma:
    name: prisma (validate · generate · drift)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kryon-protocol
    # Dummy URLs: `prisma validate`/`generate` parse the schema only — no DB is
    # contacted — but the datasource block requires the env vars to be present.
    # The drift check replays migrations into the EMPTY service container below
    # (never a real database) and diffs the result against schema.prisma.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/kryon
      DIRECT_URL: postgresql://ci:ci@localhost:5432/kryon
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: kryon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: kryon-protocol/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Validate schema
        run: npx prisma validate

      - name: Generate client
        run: npx prisma generate

      # Migrations replayed into the empty CI postgres must produce exactly
      # schema.prisma — catches ad-hoc prod SQL and schema edits that skipped
      # `prisma migrate dev`. Exit code 2 (= drift) fails the job.
      - name: Migration drift check (empty shadow)
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$DATABASE_URL" \
            --exit-code

  # ---------------------------------------------------------------------------
  # Dependency vulnerability scan. NON-BLOCKING: advisory databases change daily,
  # so a hard-failing `npm audit` makes green builds non-deterministic and can
  # freeze deploys on an unrelated advisory. Findings go to the job summary;
  # Dependabot + dependency-review.yml do the actual gating.
  # ---------------------------------------------------------------------------
  security:
    name: security (npm audit — advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci --no-audit --fund=false

      - name: Audit (report only)
        working-directory: client
        run: |
          set +e
          npm audit --audit-level=high --omit=dev > audit.txt 2>&1
          {
            echo "### npm audit (client, prod deps, high+)"
            echo ""
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Always succeed: this job informs, it does not block the pipeline.
          exit 0
