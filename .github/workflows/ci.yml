name: ci

# Continuous integration for the Kryon Perps DEX monorepo.
#
# This file only orchestrates. Each area lives in a reusable workflow
# (`_<area>.yml`, `on: workflow_call`), `changes` decides which areas a pull
# request touches, and `ci-gate` is the one check branch protection requires.
#
# Adding a job: put it in the matching `_<area>.yml` (it is then gated through
# that area's caller job below), or add a new `_<area>.yml`, call it here, and
# add the caller to `ci-gate`'s `needs:` and its gate.sh arguments. A job
# outside `ci-gate` does not block merges. See docs/engineering/CI_CD.md.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# Nothing by default; every job grants itself what it needs.
permissions: {}

# Cancel superseded runs of the same pull request to save runner minutes. Never
# cancel a push to main or a merge-queue run mid-flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Path filter. Pull requests skip the areas they do not touch; pushes to main
  # and merge-queue runs always run everything, so main is verified in full.
  # The rules (and why they fail safe) are in .github/scripts/changes.sh.
  # ---------------------------------------------------------------------------
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      client: ${{ steps.filter.outputs.client }}
      evm: ${{ steps.filter.outputs.evm }}
      rust: ${{ steps.filter.outputs.rust }}
      prisma: ${{ steps.filter.outputs.prisma }}
      integration: ${{ steps.filter.outputs.integration }}
      security: ${{ steps.filter.outputs.security }}
    steps:
      # For a pull request the checkout is the test merge commit; its first
      # parent is the base branch tip, so HEAD^1..HEAD is exactly the PR's diff.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          else
            # Everything: main and the merge queue are never path-filtered.
            echo ".github/workflows/ci.yml" > "$RUNNER_TEMP/changed.txt"
          fi
          .github/scripts/changes.sh < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"
          {
            echo "### Changed paths ($EVENT)"
            echo '```'
            head -200 "$RUNNER_TEMP/changed.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  guards:
    name: guards
    needs: changes
    permissions:
      contents: read
    uses: ./.github/workflows/_guards.yml

  client:
    name: client
    needs: changes
    if: ${{ needs.changes.outputs.client == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/_client.yml

  reference-model:
    name: reference model
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/_reference-model.yml

  evm:
    name: evm
    needs: changes
    if: ${{ needs.changes.outputs.evm == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/_evm.yml

  prisma:
    name: prisma
    needs: changes
    if: ${{ needs.changes.outputs.prisma == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/_prisma.yml

  integration:
    name: integration
    needs: changes
    if: ${{ needs.changes.outputs.integration == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/_integration.yml

  security:
    name: security
    needs: changes
    permissions:
      contents: read
    uses: ./.github/workflows/_security.yml
    with:
      audit: ${{ needs.changes.outputs.security == 'true' }}

  # ---------------------------------------------------------------------------
  # The merge gate. Branch protection requires this check alone. It fails if any
  # needed job failed or was cancelled, and treats a job the path filter skipped
  # on purpose as passed.
  # ---------------------------------------------------------------------------
  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [changes, guards, client, reference-model, evm, prisma, integration, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: All needed jobs passed or were intentionally skipped
        env:
          R_CHANGES: ${{ needs.changes.result }}
          R_GUARDS: ${{ needs.guards.result }}
          R_CLIENT: ${{ needs.client.result }}
          R_REFERENCE: ${{ needs.reference-model.result }}
          R_EVM: ${{ needs.evm.result }}
          R_PRISMA: ${{ needs.prisma.result }}
          R_INTEGRATION: ${{ needs.integration.result }}
          R_SECURITY: ${{ needs.security.result }}
        run: |
          .github/scripts/gate.sh \
            "changes=$R_CHANGES" "guards=$R_GUARDS" "client=$R_CLIENT" \
            "reference-model=$R_REFERENCE" "evm=$R_EVM" "prisma=$R_PRISMA" \
            "integration=$R_INTEGRATION" "security=$R_SECURITY"

  # ---------------------------------------------------------------------------
  # TRANSITIONAL. Jobs inside reusable workflows report as "<caller> / <job>",
  # so the five check names branch protection requires today would never
  # report. These aliases carry the exact old names and mirror their area's
  # result until protection is switched to `ci-gate` alone; then delete them.
  # ---------------------------------------------------------------------------
  legacy-separation-guard:
    name: separation-guard
    if: ${{ always() }}
    needs: [changes, guards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - env:
          R_CHANGES: ${{ needs.changes.result }}
          R: ${{ needs.guards.result }}
        run: .github/scripts/gate.sh "changes=$R_CHANGES" "guards=$R"

  legacy-client:
    name: client (lint · typecheck · test · build)
    if: ${{ always() }}
    needs: [changes, client]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - env:
          R_CHANGES: ${{ needs.changes.result }}
          R: ${{ needs.client.result }}
        run: .github/scripts/gate.sh "changes=$R_CHANGES" "client=$R"

  legacy-reference-model:
    name: reference model (fmt · clippy · test)
    if: ${{ always() }}
    needs: [changes, reference-model]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - env:
          R_CHANGES: ${{ needs.changes.result }}
          R: ${{ needs.reference-model.result }}
        run: .github/scripts/gate.sh "changes=$R_CHANGES" "reference-model=$R"

  legacy-evm:
    name: evm (arc-foundry · test · differential · layout · slither)
    if: ${{ always() }}
    needs: [changes, evm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - env:
          R_CHANGES: ${{ needs.changes.result }}
          R: ${{ needs.evm.result }}
        run: .github/scripts/gate.sh "changes=$R_CHANGES" "evm=$R"

  legacy-prisma:
    name: prisma (validate · generate · drift)
    if: ${{ always() }}
    needs: [changes, prisma]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - env:
          R_CHANGES: ${{ needs.changes.result }}
          R: ${{ needs.prisma.result }}
        run: .github/scripts/gate.sh "changes=$R_CHANGES" "prisma=$R"
