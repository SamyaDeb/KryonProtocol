name: client

# Frontend and services: lint, typecheck, unit and database tests, and a real
# Next.js build.
on:
  workflow_call:

permissions: {}

jobs:
  client:
    name: client (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client
    env:
      KRYON_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/kryon_test
    # The TxJobStore, indexer and matcher suites skip themselves without a
    # database. That is right locally and wrong here: skipping in CI means the
    # settlement and matching paths that own money are never exercised.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: kryon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Local composite actions require the repo on disk first.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-client

      - name: Migrate the test database
        # Every migration in order. A glob passed straight to `psql -f` silently
        # applies only the first file and hands the rest to psql as connection
        # arguments, which stopped being harmless the moment a second migration
        # existed.
        run: |
          for f in ../kryon-protocol/prisma/migrations/*/migration.sql; do
            echo "applying $f"
            psql "$KRYON_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # The client's node:test suites had no runner and no script, so they had
      # never executed despite CI being green. Run them.
      - name: Unit and database tests
        run: npm test

      - name: Build
        run: npm run build

      # Upload the build (minus the cache) for debugging. always() + ignore keeps
      # this from masking or failing on an earlier build error.
      - name: Upload build artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-next-build
          path: |
            client/.next/
            !client/.next/cache/**
          retention-days: 7
          if-no-files-found: ignore
