name: codeql (scheduled)

# The weekly drift scan. Every other CodeQL run is called from ci.yml, so a
# finding blocks a merge through `ci-gate` instead of only being reported.
on:
  schedule:
    - cron: "21 3 * * 1" # Mondays 03:21 UTC

permissions: {}

concurrency:
  group: codeql-scheduled
  cancel-in-progress: false

jobs:
  codeql:
    name: codeql
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    uses: ./.github/workflows/_codeql.yml
