version: 2
updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    # A release must be public for a few days before it is proposed, so a
    # compromised publish is usually caught and yanked first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      client-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Legacy chain SDK and its types: removed with the frontend and service
      # ports (Phase 3/4). Bumping them churns code that is being deleted.
      - dependency-name: "@stellar/*"
      - dependency-name: stellar-sdk
      # Major toolchain bumps are deferred until after the external audit, so
      # the frozen contracts and their clients are not re-churned mid-review.
      # Revisit once the audit report lands (see BUILD_LOG "Phase 1 freeze").
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /kryon-protocol
    schedule:
      interval: weekly
    # A release must be public for a few days before it is proposed, so a
    # compromised publish is usually caught and yanked first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      protocol-minor-patch:
        update-types:
          - minor
          - patch

  # The Rust reference model and kryon-ref (the differential-test oracle).
  - package-ecosystem: cargo
    directory: /kryon-protocol
    schedule:
      interval: weekly
    # A release must be public for a few days before it is proposed, so a
    # compromised publish is usually caught and yanked first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # Actions are pinned to full commit SHAs with a `# vX.Y.Z` comment; Dependabot
  # bumps the SHA and the comment together. The composite actions under
  # .github/actions/ are listed so their pins are kept current too.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    # A release must be public for a few days before it is proposed, so a
    # compromised publish is usually caught and yanked first.
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    # A release must be public for a few days before it is proposed, so a
    # compromised publish is usually caught and yanked first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      docs-minor-patch:
        update-types:
          - minor
          - patch
